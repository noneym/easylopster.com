name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter easylopster-node build
      - name: Bundle node agent
        run: |
          mkdir -p out
          cp packages/node-agent/dist/index.mjs out/easylopster-node.mjs
          cp -r node_modules/ws out/ws && cp -r node_modules/zod out/zod
          (cd out && tar czf ../easylopster-node-${GITHUB_REF_NAME}.tgz .)
      - name: Extract changelog section
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on=1; print; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: easylopster ${{ github.ref_name }}
          body_path: notes.md
          files: easylopster-node-${{ github.ref_name }}.tgz

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node-agent.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/easylopster-node:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/easylopster-node:latest

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easylopster/node-desktop dist
      - uses: softprops/action-gh-release@v2
        with:
          name: easylopster ${{ github.ref_name }}
          files: packages/node-desktop/release/*.exe

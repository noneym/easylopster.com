name: node-agent

on:
  push:
    branches: [main]
    paths:
      - "packages/node-agent/**"
      - "packages/shared/**"
      - "docker/node-agent.Dockerfile"
      - ".github/workflows/node-agent.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node-agent.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/easylopster-node:latest
            ghcr.io/${{ github.repository_owner }}/easylopster-node:${{ github.sha }}

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter easylopster-node build
      # Single-file bundle: run anywhere with `node easylopster-node.mjs connect <CODE>`
      - run: |
          mkdir -p out
          cp packages/node-agent/dist/index.mjs out/easylopster-node.mjs
          cp -r node_modules/ws out/ws && cp -r node_modules/zod out/zod
          cd out && tar czf ../easylopster-node-bundle.tgz .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: node-agent-latest
          name: easylopster-node (latest)
          prerelease: true
          files: easylopster-node-bundle.tgz
